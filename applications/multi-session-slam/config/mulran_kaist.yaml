ltslam:

  sessions_dir: "/data/sessions/"        # end with /

  central_sess_name: "KAIST_01"          # reference session
  query_sess_name: "KAIST_03"            # query session

  save_directory: "/data/sessions/LT_result/"   # end with /

  is_display_debug_msgs: false

  # the single-session loop check (applications/slam/common/loop_registration): nano-GICP seeded with the
  # angle descriptor's yaw, fitness <= loopFitnessScoreThreshold, residual translation <= loopMaxTranslation (m)
  loopFitnessScoreThreshold: 200.0
  loopMaxTranslation: 3.0

  kNumSCLoopsUpperBound: 1000            # use all detected inter-session loops
  kNumRSLoopsUpperBound: 0               # RS loops off

  numberOfCores: 16
