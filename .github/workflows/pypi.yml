# Wheel + sdist of referee-radar (pure Python); uploaded to PyPI on a published release
# (trusted publishing: a pending publisher on pypi.org for this workflow, environment "pypi").
name: PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx run build
      - name: Install the wheel and run the tests
        run: |
          pip install dist/*.whl pytest
          python -c "import referee; print(referee.__version__)"
          pytest -q python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
